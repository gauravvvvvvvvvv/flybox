name: Feature request
description: Propose a new FLYBOX capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or research need
      description: What should become possible, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the interaction, API, experiment, or implementation at a high level.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Neuroscience / connectome
        - Simulation
        - Experiment / challenge
        - 3D visualization
        - Frontend / UX
        - Backend / API
        - SDK / developer tooling
        - Documentation
        - Deployment / performance
        - Other
    validations:
      required: true
  - type: textarea
    id: science
    attributes:
      label: Scientific provenance
      description: If this touches biology, what is measured/known versus experimental or invented? Include references if relevant.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and documentation first.
          required: true
